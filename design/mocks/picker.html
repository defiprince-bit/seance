<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a spirit · Séance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=VT323&family=Jolly+Lodger&display=swap" rel="stylesheet"><style>
/* Séance design tokens: source of truth (mirrored in seance-steering.md) */
:root{
  /* surfaces */
  --void:#0A090C;        /* app background */
  --crypt:#121015;       /* panes, cards */
  --altar:#1A171E;       /* raised: inputs, menus, active rows */
  --terminal:#0D110E;    /* CRT code + run output background */
  --seam:#2B2631;        /* hairline borders */
  --seam-strong:#3D3645; /* hover borders, dividers on raised */
  /* text */
  --bone:#EDE6D8;        /* primary text, 15.2:1 on crypt */
  --ash:#B3A999;         /* secondary text, 8.1:1 */
  --dust:#8E8578;        /* footnotes, line numbers, 5.2:1 */
  /* accents */
  --candle:#E9A957;      /* primary action, active line, focus */
  --candle-deep:#B9772F; /* pressed */
  --candle-ink:#1A1006;  /* text on candle, 9.2:1 */
  --candle-veil:rgba(233,169,87,.10); /* active-line wash */
  --phosphor:#9FDDB0;    /* dead-language code text, success */
  --phosphor-dim:#74A983;/* code comments, sequence area */
  --ecto:#C7C0E6;        /* the ghost's voice: narration accents */
  --danger:#EE8E7E;      /* errors */
  /* type */
  --font-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-crt:"VT323", "IBM Plex Mono", monospace; /* run output + tiny labels only */
  --text-xs:12px; --text-sm:13px; --text-base:14px; --text-md:16px;
  --text-lg:20px; --text-xl:28px; --text-2xl:40px; --text-hero:56px;
  --leading-tight:1.1; --leading-snug:1.3; --leading-body:1.55; --leading-code:20px;
  /* spacing (4px base) */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  --s-8:32px; --s-10:40px; --s-14:56px; --s-20:80px;
  /* radii */
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:20px; --r-pill:999px;
  /* elevation + glow */
  --shadow-pane:inset 0 1px 0 rgba(255,255,255,.03), 0 24px 60px -28px rgba(0,0,0,.7);
  --shadow-pop:0 18px 50px -12px rgba(0,0,0,.75);
  --glow-candle:0 0 0 1px rgba(233,169,87,.40), 0 0 28px rgba(233,169,87,.18);
  --glow-phosphor:0 0 6px rgba(159,221,176,.35);  /* text-shadow on code */
  --ring:0 0 0 2px var(--void), 0 0 0 4px var(--candle);
  /* motion */
  --d-instant:80ms; --d-fast:160ms; --d-base:240ms; --d-slow:420ms;
  --d-glide:600ms; --d-breathe:4800ms; --stagger-line:40ms;
  --ease-out:cubic-bezier(.2,.7,.2,1);
  --ease-glide:cubic-bezier(.65,0,.35,1);
  --ease-in:cubic-bezier(.5,0,.75,0);
}
/* v2 landing additions (Douglas review, 9 Nov 2026): playful spooky landing */
:root{
  --font-spooky:"Jolly Lodger", "Instrument Serif", Georgia, serif; /* landing display + wordmark only */
  --pumpkin:#FF4A2E;      /* accent word, round CTA icon, wordmark. 4.6:1 on --charcoal */
  --pumpkin-deep:#D9361D; /* pressed */
  --pumpkin-glow:rgba(255,106,48,.45);
  --charcoal:#242428;     /* landing card surface */
  --charcoal-raised:#2E2E34; /* pills, tiles, chips hover */
  --charcoal-line:#45454D;   /* outline chips / pill borders */
  --card-text:#F6F1EA;    /* headline on charcoal */
  --card-body:#C9C4BC;    /* body on charcoal, 8.9:1 */
  --card-muted:#9A958E;   /* footnotes on charcoal, 5.2:1 */
  --web:#F4EADF;          /* cobweb strokes, used at .7 opacity */
  --backdrop:radial-gradient(120% 90% at 100% 0%,#D8622F 0%,#B24A26 28%,transparent 62%),radial-gradient(90% 80% at 0% 100%,#C25A2C 0%,#8E3E22 30%,transparent 65%),linear-gradient(160deg,#5E5752 0%,#6B4A3A 45%,#9C4524 100%);
  --vignette:radial-gradient(130% 100% at 50% 50%,transparent 55%,rgba(20,10,6,.55) 100%);
  --r-card:24px; --r-tile:22px;
  --d-sway:7000ms; --d-float:6000ms;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--void);color:var(--bone);font:400 var(--text-base)/var(--leading-body) var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 700px at 50% -10%,rgba(233,169,87,.07),transparent 60%),radial-gradient(900px 600px at 100% 110%,rgba(199,192,230,.05),transparent 60%)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
.serif{font-family:var(--font-display);font-weight:400}
.it{font-style:italic}
.mono{font-family:var(--font-code)}
.eyebrow{font:500 var(--text-xs)/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.foot{font-size:var(--text-xs);color:var(--dust)}
/* mark + wordmark */
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font:400 27px/1 var(--font-spooky);letter-spacing:.01em;color:var(--pumpkin)}
/* v2: one small cobweb in the app top bar corner; decorative only */
.topbar-web{position:absolute;top:0;right:0;width:64px;height:56px;overflow:hidden;opacity:.34;pointer-events:none}
.topbar-web svg{width:64px;height:64px;transform:scaleX(-1);transform-origin:50% 50%}
.topbar.has-web{padding-right:76px}
@media (max-width:767px){.topbar-web{width:44px}.topbar-web svg{width:44px;height:44px}.topbar.has-web{padding-right:52px}}
/* top bar */
.topbar{position:relative;z-index:5;height:56px;display:flex;align-items:center;gap:var(--s-6);padding:0 var(--s-6);border-bottom:1px solid var(--seam);background:rgba(10,9,12,.82);backdrop-filter:blur(10px)}
.topbar nav{display:flex;gap:var(--s-6)}
.topbar nav a{text-decoration:none;color:var(--ash);font-size:var(--text-sm)}
.topbar nav a:hover{color:var(--bone)}
.spacer{flex:1}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--seam-strong);background:transparent;color:var(--bone);font:500 var(--text-sm)/1 var(--font-body);text-decoration:none;cursor:pointer;transition:background var(--d-fast) var(--ease-out),border-color var(--d-fast) var(--ease-out),transform var(--d-instant) var(--ease-out)}
.btn:hover{border-color:var(--ash);background:rgba(255,255,255,.03)}
.btn:active{transform:translateY(1px)}
.btn-lg{height:44px;padding:0 20px;font-size:var(--text-base)}
.btn-candle{position:relative;background:var(--candle);border-color:var(--candle);color:var(--candle-ink)}
.btn-candle:hover{background:#F0B56A;border-color:#F0B56A}
.btn-candle:active{background:var(--candle-deep)}
.btn-candle::after{content:"";position:absolute;inset:-6px;border-radius:14px;box-shadow:0 0 26px rgba(233,169,87,.45);opacity:.5;pointer-events:none;animation:breathe var(--d-breathe) ease-in-out infinite}
.kbd{font:500 11px/1 var(--font-code);padding:3px 5px;border-radius:4px;background:rgba(0,0,0,.18);}
.btn-ghost{border-color:transparent;color:var(--ash)}
.btn-ghost:hover{color:var(--bone);background:rgba(255,255,255,.04);border-color:transparent}
/* status pill */
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--seam);font-size:var(--text-xs);color:var(--ash);background:var(--crypt)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--phosphor);position:relative}
.pill i::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--phosphor);opacity:.25;animation:breathe var(--d-breathe) ease-in-out infinite}
.pill.is-summoning i{background:var(--candle)} .pill.is-summoning i::after{background:var(--candle)}
.pill.is-error i{background:var(--danger)} .pill.is-error i::after{display:none}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--seam);background:var(--altar);font-size:var(--text-sm);color:var(--ash);cursor:pointer}
.chip:hover{border-color:var(--seam-strong);color:var(--bone)}
/* panes */
.pane{position:relative;background:var(--crypt);border:1px solid var(--seam);border-radius:var(--r-md);box-shadow:var(--shadow-pane);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:10px;height:44px;padding:0 var(--s-4);border-bottom:1px solid var(--seam);flex:none}
.pane-h h3{margin:0;font:italic 400 19px/1 var(--font-display);color:var(--bone)}
.pane-h .meta{font-size:var(--text-xs);color:var(--dust)}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid transparent;background:none;color:var(--ash);cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.05);color:var(--bone)}
.icon-btn svg{width:16px;height:16px}
/* CRT surface: static scanlines, never animated */
.crt{background:var(--terminal);position:relative}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
/* motion primitives (opacity/transform only) */
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes flickerIn{0%{opacity:0}55%{opacity:.75}70%{opacity:.5}100%{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes lineIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}} /* 1.06s cycle < 1Hz */
.flicker-in{animation:flickerIn var(--d-slow) var(--ease-out) both}
.rise-in{animation:riseIn var(--d-slow) var(--ease-out) both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
  .btn-candle::after,.pill i::after{animation:none!important;opacity:.5}
}

</style>
<style>
.backdrop{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}
.ghostui{flex:1;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;padding:16px 24px 20px}
.ghostui div{border:1px solid var(--seam);border-radius:var(--r-md);background:var(--crypt)}
.ghostui .t{grid-column:1/-1;height:52px;background:var(--altar)}
.scrim{position:fixed;inset:0;z-index:2;background:rgba(6,5,8,.72);backdrop-filter:blur(3px);animation:riseIn var(--d-base) var(--ease-out) both}
.dialog{position:fixed;z-index:3;left:50%;top:50%;width:min(1080px,calc(100vw - 64px));transform:translate(-50%,-50%);background:var(--crypt);border:1px solid var(--seam-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);overflow:hidden}
.dialog::before{content:"";position:absolute;left:50%;top:-220px;width:700px;height:400px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(233,169,87,.12),transparent);pointer-events:none;animation:breathe var(--d-breathe) ease-in-out infinite}
.dh{position:relative;display:flex;align-items:start;gap:var(--s-4);padding:var(--s-8) var(--s-8) var(--s-6)}
.dh h1{margin:var(--s-2) 0 var(--s-2);font:400 var(--text-xl)/1.1 var(--font-display)} .dh h1 em{color:var(--candle)}
.dh p{margin:0;color:var(--ash);max-width:520px}
.cards{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-4);padding:0 var(--s-8)}
.card{position:relative;display:flex;flex-direction:column;gap:var(--s-3);padding:var(--s-5);border-radius:var(--r-md);border:1px solid var(--seam);background:var(--void);cursor:pointer;text-align:left;transition:border-color var(--d-fast) var(--ease-out),transform var(--d-base) var(--ease-out),background var(--d-fast) var(--ease-out)}
.card:hover{border-color:var(--seam-strong);transform:translateY(-2px)}
.card[aria-checked=true]{border-color:var(--candle);box-shadow:var(--glow-candle);background:linear-gradient(180deg,rgba(233,169,87,.06),transparent 50%),var(--void)}
.card .top{display:flex;align-items:baseline;justify-content:space-between}
.card h2{margin:0;font:italic 400 30px/1 var(--font-display);color:var(--bone)}
.card .yr{font:400 18px/1 var(--font-crt);color:var(--dust)}
.card .ep{color:var(--ecto);font-size:var(--text-sm);margin-top:-6px}
.card .desc{margin:0;color:var(--ash);font-size:var(--text-sm)}
.card pre{margin:0;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--seam);font:400 11.5px/18px var(--font-code);color:var(--phosphor);text-shadow:var(--glow-phosphor);overflow:hidden;white-space:pre}
.card pre .kw{color:#D4F5DC}.card pre .lit{color:var(--candle)}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits span{height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:var(--r-pill);border:1px solid var(--seam);font-size:var(--text-xs);color:var(--ash)}
.radio{position:absolute;top:var(--s-5);right:var(--s-5);width:18px;height:18px;border-radius:50%;border:1.5px solid var(--seam-strong);display:none}
.card .sel{display:none;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--candle);font-weight:500}
.card[aria-checked=true] .sel{display:inline-flex}
.card .ep{display:flex;justify-content:space-between;align-items:center}
.dialect{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.dialect label{font-size:var(--text-xs);color:var(--dust)}
.select{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--seam);background:var(--altar);font-size:var(--text-sm);color:var(--bone)}
.card.rest{cursor:default;border-style:dashed;background:transparent;justify-content:center;align-items:start}
.card.rest:hover{transform:none;border-color:var(--seam)}
.card.rest h2{font-size:22px;color:var(--ash)}
.df{position:relative;display:flex;align-items:center;gap:var(--s-3);padding:var(--s-6) var(--s-8);margin-top:var(--s-6);border-top:1px solid var(--seam)}
.df .foot{flex:1}
.close{position:absolute;top:var(--s-6);right:var(--s-6)}
.handle{display:none}
@media (max-width:1100px){.cards{grid-template-columns:1fr 1fr}.card.rest{display:none}}
@media (max-width:767px){
 .ghostui{display:none}
 .dialog{left:0;right:0;top:auto;bottom:0;width:auto;transform:none;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92vh;display:flex;flex-direction:column;animation:riseIn var(--d-slow) var(--ease-out) both}
 .handle{display:block;width:36px;height:4px;border-radius:2px;background:var(--seam-strong);margin:10px auto 0}
 .dh{padding:var(--s-4) var(--s-5) var(--s-4)} .dh h1{font-size:26px} .dh p{font-size:var(--text-sm)}
 .close{top:var(--s-4);right:var(--s-4)}
 .cards{grid-template-columns:1fr;padding:0 var(--s-5);overflow:auto;gap:var(--s-3)}
 .card{padding:var(--s-4);gap:var(--s-2)} .card h2{font-size:26px}
 .card:not([aria-checked=true]) pre,.card:not([aria-checked=true]) .dialect,.card:not([aria-checked=true]) .traits{display:none}
 .card:not([aria-checked=true]) .desc{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
 .df{margin-top:var(--s-3);padding:var(--s-4) var(--s-5) var(--s-5);flex-wrap:wrap} .df .foot{flex-basis:100%;order:3}
 .df .btn{flex:1;justify-content:center;white-space:nowrap} .df .kbd{display:none}
}
</style></head><body>

  <div class="dh">
    <div><span class="eyebrow">Step 1 of your séance</span><h1 id="pk-title">Who should <em class="it">answer?</em></h1><p>Pick the language the ghost writes in. You can switch mid-séance and keep your task.</p></div>
    <button class="icon-btn close" aria-label="Close"><svg viewBox="0 0 16 16" fill="none"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5"/></svg></button>
  </div>
  <div class="cards" role="radiogroup" aria-labelledby="pk-title">
    <button class="card" role="radio" aria-checked="true" tabindex="0">
      <div class="top"><h2>COBOL</h2><span class="yr">b. 1959</span></div>
      <div class="ep"><span>The ledger keeper</span><span class="sel"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="m3 7.5 2.5 2.5L11 4" stroke="currentColor" stroke-width="1.6"/></svg>Selected</span></div>
      <p class="desc">Records, money and files. Wordy on purpose, so a manager could read it.</p>
<pre class="crt"><span class="kw">UNSTRING</span> SALES-LINE
  <span class="kw">DELIMITED BY</span> <span class="lit">","</span>
  <span class="kw">INTO</span> WS-REGION WS-AMOUNT-TXT
<span class="kw">ADD</span> WS-AMOUNT <span class="kw">TO</span> WS-TOTAL</pre>
      <div class="traits"><span>Reads like English</span><span>Exact decimals</span><span>Fixed columns</span></div>
      <div class="dialect"><label>Dialect</label><div class="select">COBOL-85, fixed format<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.4"/></svg></div></div>
    </button>
    <button class="card" role="radio" aria-checked="false" tabindex="-1">
      <div class="top"><h2>Fortran</h2><span class="yr">b. 1957</span></div>
      <div class="ep"><span>The calculator</span><span class="sel"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="m3 7.5 2.5 2.5L11 4" stroke="currentColor" stroke-width="1.6"/></svg>Selected</span></div>
      <p class="desc">Numbers, arrays and formulas. Made so scientists didn’t have to write machine code.</p>
<pre class="crt"><span class="kw">read</span>(10, *, <span class="kw">iostat</span>=ios) region, amount
<span class="kw">if</span> (ios /= 0) <span class="kw">exit</span>
total = total + amount</pre>
      <div class="traits"><span>Fast maths</span><span>Arrays first</span><span>Terse</span></div>
      <div class="dialect"><label>Dialect</label><div class="select">Fortran 90, free form<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.4"/></svg></div></div>
    </button>
    <button class="card" role="radio" aria-checked="false" tabindex="-1">
      <div class="top"><h2>BASIC</h2><span class="yr">b. 1964</span></div>
      <div class="ep"><span>The first teacher</span><span class="sel"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="m3 7.5 2.5 2.5L11 4" stroke="currentColor" stroke-width="1.6"/></svg>Selected</span></div>
      <p class="desc">Line numbers, GOTO and instant answers. Built for students at a shared terminal.</p>
<pre class="crt">20 <span class="kw">READ</span> R$, A
30 <span class="kw">IF</span> R$ = <span class="lit">"END"</span> <span class="kw">THEN</span> 60
40 <span class="kw">LET</span> T = T + A
50 <span class="kw">GOTO</span> 20</pre>
      <div class="traits"><span>Beginner friendly</span><span>Line numbers</span><span>GOTO</span></div>
      <div class="dialect"><label>Dialect</label><div class="select">Classic line-numbered<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.4"/></svg></div></div>
    </button>

  </div>
  <div class="df">
    <span class="foot">Not sure? Start with COBOL, it’s the one employers still ask about. ALGOL, Pascal and friends are still resting.</span>
    <button class="btn btn-lg">Cancel</button>
    <a class="btn btn-candle btn-lg" href="workspace.html" id="go">Summon with COBOL <span class="kbd">⏎</span></a>
  </div>
</div>
<script>
const cards=[...document.querySelectorAll('.card[role=radio]')];
function pick(c){cards.forEach(x=>{x.setAttribute('aria-checked',x===c);x.tabIndex=x===c?0:-1});document.getElementById('go').firstChild.textContent='Summon with '+c.querySelector('h2').textContent+' ';}
cards.forEach((c,i)=>{c.onclick=()=>pick(c);c.onkeydown=e=>{const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(d){e.preventDefault();const n=cards[(i+d+cards.length)%cards.length];pick(n);n.focus()}}});
</script>
</body></html>
